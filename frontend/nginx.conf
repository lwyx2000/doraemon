# 后端连接池：keep-alive 复用 TCP 连接。
# 原先 location 内直接 proxy_pass http://backend:8001 且未指定
# proxy_http_version，nginx 对上游默认用 HTTP/1.0 且每次请求后关闭连接——
# 一页 10+ 接口 = 10+ 次到 backend 的三次握手。改 upstream + keepalive 后
# 连接复用，配合 backend 侧共享 requests.Session（对网关同理）全省省握手。
upstream backend_pool {
    server backend:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 响应压缩（2026-10-17）：nginx:alpine 默认 gzip on 但 gzip_types 仅含
    #   text/html —— 实测带 Accept-Encoding: gzip 请求 JS bundle / API JSON
    #   仍原样返回（JS 914KB、charts/all 1.52MB 全裸传）。显式声明类型后：
    #   首屏 JS 约 -70%、图表 JSON 约 -80%（空图轮询流量同比例下降）。
    #   ⚠️ text/event-stream（AI SSE）不在列表中：gzip 会缓冲输出破坏流式，
    #   不声明即不压缩，与 /api/ 的 proxy_buffering off 各管一层。
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;

    # 健康检查：精确匹配优先于下面的 SPA 兜底，避免被 index.html 吃掉
    location = /health {
        proxy_pass http://backend:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Vue Router history 模式支持
    location / {
        try_files $uri $uri/ /index.html;
        # ⚠️ index.html **必须禁缓存**（2026-10-09）：它引用的是带 hash 的
        #   js/css（如 index-Bt4iX36U.js），若被浏览器启发式缓存住，
        #   部署新版后仍会加载**旧的 hash 文件** → 用户看到的还是老页面，
        #   侧边栏的「构建版本号」也跟着不更新 —— 而版本号的存在意义正是判断部署。
        #   js/css 带 hash，放心长缓存（见下），二者不能对称。
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 静态资源缓存（文件名带内容 hash，可安全长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # SSE 双保险（2026-10-14 审计 P2-5）：AI 解读/问答为 text/event-stream，
        # 后端已发 X-Accel-Buffering: no 响应头，此处再关 nginx 响应缓冲，
        # 任一层失效都不会把流攒成整包延迟下发。
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 估值等接口首次取数需打多路远程网关，可能耗时数十秒；
        # 放大读超时避免 nginx 在缓存预热完成前返回 504。
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
