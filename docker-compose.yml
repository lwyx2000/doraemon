# Doraemon QuantTerminal Pro 部署
# 启动：docker compose up -d --build
# 访问：http://<host>:8080

services:
  backend:
    build: ./backend
    container_name: doraemon_backend
    environment:
      - DB_PATH=/data/quantterminal.duckdb
      - JWT_SECRET=${JWT_SECRET:-quantterminal-secret-key-change-in-production}
      - USE_MOCK_DATA=false
      - AKSHARE_API_BASE=${AKSHARE_API_BASE:-http://10.100.213.248:8000}
      - ADMIN_USERS=${ADMIN_USERS:-sos}
      - WECOM_WEBHOOK_URL=${WECOM_WEBHOOK_URL:-}
      - DINGTALK_WEBHOOK_URL=${DINGTALK_WEBHOOK_URL:-}
      # 段错误时打印 Python native 栈（2026-10-19 加：定位 duckdb segfault）
      - PYTHONFAULTHANDLER=1
      # P0 止血（2026-10-19）：base_sw_sector_daily 表损坏致 duckdb native 段错误，
      # SW 快照写入/定时任务默认关闭；表修复后将两个值改 1 并重新部署即恢复
      - SW_SNAPSHOT_WRITE=0
      - SW_SNAPSHOT_JOB=0
    volumes:
      - doraemon_data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: doraemon_frontend
    ports:
      - "9080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  doraemon_data:
